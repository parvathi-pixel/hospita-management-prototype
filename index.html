<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emergency Medical Record Assistant — Hackathon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F8FA; --surface:#FFFFFF; --ink:#0E2A3A; --muted:#506978; --line:#D8E3E9;
  --teal:#0F7C86; --teal-hover:#0B636B; --teal-text:#0B5E66; --teal-soft:#E1F3F4; --on-teal:#FFFFFF;
  --blue:#2A62A8; --blue-soft:#E7EFFA;
  --red:#B5202A; --red-btn:#C0262D; --red-soft:#FCEBEC;
  --amber:#8A5200; --amber-soft:#FFF2D8;
  --green:#1B6E44; --green-soft:#E3F4EB;
  --shadow:0 12px 40px rgba(14,42,58,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1920; --surface:#112630; --ink:#E6F0F4; --muted:#9AB0BB; --line:#25414D;
    --teal:#3DBFCA; --teal-hover:#63D3DC; --teal-text:#7FDDE5; --teal-soft:#123A41; --on-teal:#04232A;
    --blue:#82B0EA; --blue-soft:#14283F;
    --red:#FF8086; --red-btn:#D1454B; --red-soft:#3A1A1E;
    --amber:#F2B866; --amber-soft:#3A2D13;
    --green:#5FCF97; --green-soft:#12342A;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1920; --surface:#112630; --ink:#E6F0F4; --muted:#9AB0BB; --line:#25414D;
  --teal:#3DBFCA; --teal-hover:#63D3DC; --teal-text:#7FDDE5; --teal-soft:#123A41; --on-teal:#04232A;
  --blue:#82B0EA; --blue-soft:#14283F;
  --red:#FF8086; --red-btn:#D1454B; --red-soft:#3A1A1E;
  --amber:#F2B866; --amber-soft:#3A2D13;
  --green:#5FCF97; --green-soft:#12342A;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,p{margin:0;}
h1{font-size:clamp(32px,4.4vw,48px);line-height:1.12;font-weight:700;letter-spacing:-.02em;}
h2{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.01em;}
h3{font-size:18px;line-height:1.3;font-weight:600;}
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
.muted{color:var(--muted);}
.sm-text{font-size:14px;}
.ic{flex:none;vertical-align:middle;}

/* chrome */
.demo-bar{display:flex;gap:8px;align-items:center;justify-content:center;text-align:center;padding:8px 16px;background:var(--blue-soft);color:var(--blue);font-size:13.5px;font-weight:500;border-bottom:1px solid var(--line);}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);}
.brand{display:flex;gap:10px;align-items:center;font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left;}
.logo{width:36px;height:36px;border-radius:10px;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;}
.userchip{display:flex;align-items:center;gap:12px;font-size:14px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;}
.btn:hover{border-color:var(--teal);}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal);}
.btn.primary:hover{background:var(--teal-hover);border-color:var(--teal-hover);}
.btn.danger{background:var(--red-btn);border-color:var(--red-btn);color:#fff;}
.btn.danger:hover{filter:brightness(.92);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal-text);}
.btn.lg{padding:14px 22px;font-size:17px;border-radius:12px;}
.btn.sm{padding:6px 12px;font-size:14px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--teal-soft);color:var(--teal-text);white-space:nowrap;}
.chip.red{background:var(--red-soft);color:var(--red);}
.chip.amber{background:var(--amber-soft);color:var(--amber);}
.chip.blue{background:var(--blue-soft);color:var(--blue);}
.chip.green{background:var(--green-soft);color:var(--green);}
.src{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:2px 0;color:var(--teal-text);font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;}
.card h3{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.grid{display:grid;gap:16px;}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr));}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;}
.stat{display:flex;gap:14px;align-items:center;}
.stat .num{font-size:32px;font-weight:600;line-height:1;}
.badge-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-text);flex:none;}
.tone-red{background:var(--red-soft);color:var(--red);}
.tone-amber{background:var(--amber-soft);color:var(--amber);}
.tone-blue{background:var(--blue-soft);color:var(--blue);}
.tone-green{background:var(--green-soft);color:var(--green);}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding:56px 0 40px;}
.hero .sub{font-size:22px;color:var(--teal-text);margin-top:14px;font-weight:500;}
.hero .lead{margin-top:16px;max-width:56ch;color:var(--muted);font-size:17px;}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:28px;}
.role{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;}
.role:hover{border-color:var(--teal);}
.role.main{border-color:var(--teal);background:var(--teal-soft);}
.role b{font-weight:600;}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);}
.mock .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600;}
.mock .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:8px 0 40px;}
.feat .card p{color:var(--muted);font-size:15px;}
.foot{padding:24px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);}

/* login */
.login-wrap{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:32px 16px;}
.login{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px;}
.field label{font-weight:500;font-size:15px;}
input[type=text],input[type=password],input[type=date]{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;}
input:focus{outline:3px solid var(--blue);outline-offset:1px;}
.demo-box{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:14px;}
.demo-box code{font:inherit;font-weight:600;}
.err{margin-top:12px;color:var(--red);font-size:14.5px;font-weight:500;}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 110px);}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font-weight:500;color:var(--ink);}
.nav:hover{background:var(--bg);}
.nav.on{background:var(--teal-soft);color:var(--teal-text);}
.side .sep{height:1px;background:var(--line);margin:10px 4px;}
.side .lbl{font-size:13px;color:var(--muted);padding:2px 12px;}
.main{padding:28px 32px 56px;width:100%;max-width:1120px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.pagehead p{color:var(--muted);margin-top:4px;}
.secure{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:18px;}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;}
  .side .sep,.side .lbl{display:none;}
  .nav{white-space:nowrap;}
  .main{padding:20px 16px 48px;}
  .hero{grid-template-columns:1fr;gap:32px;padding-top:32px;}
  .topbar{padding:12px 16px;}
  .wrap{padding:0 16px;}
}

/* tables */
.scroll{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:15px;}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13.5px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl tr:last-child td{border-bottom:0;}
.tbl tr.newrow td{background:var(--teal-soft);}

/* search */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap;}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;}
.seg button.on{background:var(--surface);color:var(--teal-text);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.searchrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.searchrow input{flex:1;min-width:220px;}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;margin-top:16px;}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--teal-soft);color:var(--teal-text);display:grid;place-items:center;font-weight:600;font-size:18px;}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin:10px 0 0;}
.facts div{min-width:120px;}
.facts dt{font-size:13px;color:var(--muted);}
.facts dd{margin:0;font-weight:500;}
.facts dd.red{color:var(--red);font-weight:600;}
@media (max-width:700px){.pcard{grid-template-columns:1fr;}}

/* access */
.reasonbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0;}
.reasonbox div{background:var(--bg);border-radius:12px;padding:12px 14px;}
.reasonbox dt{font-size:13px;color:var(--muted);}
.reasonbox dd{margin:2px 0 0;font-weight:600;}
.checkrow{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;}
.checkrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);}
.granted{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:600;margin-top:16px;}

/* patient context */
.pthead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.pthead .who{display:flex;align-items:center;gap:14px;}
.pthead .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px;}
.tabs button{display:flex;gap:8px;align-items:center;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--muted);}
.tabs button.on{color:var(--teal-text);border-bottom-color:var(--teal);}
.allergy{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--red-soft);border:2px solid var(--red);border-radius:16px;padding:20px 24px;margin-bottom:16px;}
.allergy .big{font-size:36px;line-height:1.1;font-weight:700;color:var(--red);}
.allergy .icon{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;}
.allergy h2{font-size:15px;color:var(--red);font-weight:600;}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
.list li{display:flex;flex-direction:column;gap:2px;}
.list b{font-weight:600;}
.callout{background:var(--amber-soft);border-color:transparent;}
.callout h3,.callout p{color:var(--amber);}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:14.5px;}
.nextrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}

/* timeline */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:28px;align-items:start;}
.sticky{position:sticky;top:16px;}
@media (max-width:1000px){.split{grid-template-columns:1fr;}.sticky{position:static;}}
.tl{list-style:none;margin:0;padding:0;}
.tl-item{display:grid;grid-template-columns:104px 28px minmax(0,1fr);column-gap:10px;position:relative;padding-bottom:14px;}
.tl-item::before{content:"";position:absolute;left:127px;top:26px;bottom:-12px;width:2px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-date{text-align:right;padding-top:9px;}
.tl-date b{display:block;font-weight:600;}
.tl-date span{font-size:12.5px;color:var(--muted);}
.tl-dot{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--teal);margin:14px auto 0;position:relative;z-index:1;}
.tl-item.red .tl-dot{border-color:var(--red);}
.tl-item.amber .tl-dot{border-color:var(--amber);}
.tl-card{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;}
.tl-card:hover{border-color:var(--teal);}
.tl-item.sel .tl-card{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}
.tl-card b{display:block;font-weight:600;}
.tl-card small{color:var(--muted);font-size:13px;}
@media (max-width:560px){
  .tl-item{grid-template-columns:78px 24px minmax(0,1fr);}
  .tl-item::before{left:100px;}
}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0 0;font-size:15px;}
dl.kv dt{color:var(--muted);}
dl.kv dd{margin:0;font-weight:500;}

/* records */
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14.5px;font-weight:500;}
.fchip.on{background:var(--teal);color:var(--on-teal);border-color:var(--teal);}
.dategrp{margin-top:22px;}
.dategrp>h4{font-size:14.5px;color:var(--muted);font-weight:600;margin-bottom:8px;}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
.rec.flash{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);}
.rec-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;}
.rec-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.rec p{margin-top:6px;font-size:15px;}
@media (max-width:640px){.rec{grid-template-columns:auto 1fr;}.rec-act{grid-column:1 / -1;}}

/* modal + doc */
.overlay{position:fixed;inset:0;background:rgba(8,24,32,.6);display:grid;place-items:center;padding:16px;z-index:50;}
.modal{background:var(--surface);border-radius:18px;max-width:660px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--shadow);}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;}
.doc{border:1px dashed var(--line);border-radius:12px;padding:18px;background:var(--bg);}
.doc .wm{font-size:13px;color:var(--amber);background:var(--amber-soft);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:10px;font-weight:500;}
.doc h4{font-size:17px;}
.doc .tbl{margin-top:10px;}

/* misc */
.how{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;}
.how .chip{font-size:14px;padding:5px 14px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:8px;}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:13px;color:var(--muted);}
.bars i{display:block;width:100%;max-width:38px;background:var(--teal);border-radius:8px 8px 4px 4px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:92vw;}
.rowlist{display:flex;flex-direction:column;}
.rowlist>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
.rowlist>div:first-child{border-top:0;}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important;transition:none !important;animation:none !important;}}
</style>
</head>

var VIEWS={landing:viewLanding,'login-doctor':function(){return viewLogin('doctor');},'login-admin':function(){return viewLogin('admin');},'login-patient':function(){return viewLogin('patient');},
  dashboard:viewDashboard,search:viewSearch,access:viewAccess,summary:viewSummary,timeline:viewTimeline,records:viewRecords,sources:viewSources,audit:viewAudit,admin:viewAdmin,patient:viewPatient};

/* ---------- render & routing ---------- */
function render(top){
  var r=S.route;
  if(ROUTES.indexOf(r)<0)r='landing';
  if(DOCTOR_ROUTES.indexOf(r)>-1&&S.role!=='doctor')r='login-doctor';
  if(r==='access'&&!S.patient)r='search';
  if(PT_ROUTES.indexOf(r)>-1&&!S.access)r=S.patient?'access':'search';
  if(r==='admin'&&S.role!=='admin')r='login-admin';
  if(r==='patient'&&S.role!=='patient')r='login-patient';
  S.route=r;
  app.innerHTML=VIEWS[r]();
  try{if(location.hash!=='#'+r)history.replaceState(null,'','#'+r);}catch(e){}
  document.title='Emergency Medical Record Assistant (demo)';
  if(top)window.scrollTo(0,0);
  if(S.focus){var el=document.getElementById('rec-'+S.focus);if(el)el.scrollIntoView({block:'center'});S.focus=null;}
}
function go(r){S.route=r;S.err='';closeModal();try{if(location.hash!=='#'+r)location.hash=r;}catch(e){}render(true);}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==S.route){S.route=h;closeModal();render(true);}});

function login(role){
  var id=(document.getElementById('uid').value||'').trim(),pw=document.getElementById('pwd').value||'',c=CREDS[role];
  if(id.toUpperCase()===c.id&&pw===c.pw){S.role=role;S.err='';go(role==='doctor'?'dashboard':role);}
  else{S.err='Incorrect ID or password. Use the demo credentials shown below the form.';render();var u=document.getElementById('uid');if(u)u.value=id;}
}
function logout(){S.role=null;S.patient=null;S.access=false;S.confirm=false;S.accessErr=false;S.q='';S.searched=false;S.emergency=false;go('landing');}
function doSearch(){var q=document.getElementById('q');if(q)S.q=q.value;S.searched=true;render();}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act]');
  if(!t)return;
  if(t.getAttribute('data-act')==='close-modal'&&t.classList.contains('overlay')&&e.target!==t)return;
  var g=t.getAttribute('data-go');
  if(g){go(g);return;}
  var a=t.getAttribute('data-act'),arg=t.getAttribute('data-arg');
  switch(a){
    case 'login':login(arg);break;
    case 'fill':document.getElementById('uid').value=CREDS[arg].id;document.getElementById('pwd').value=CREDS[arg].pw;break;
    case 'logout':logout();break;
    case 'emerg':S.emergency=true;S.mode='id';S.q='';S.searched=false;go('search');break;
    case 'dash-search':var d=(document.getElementById('dq').value||'').trim();if(!d){toast('Enter a patient ID or name.');break;}
      S.mode=/^pat/i.test(d)?'id':'name';S.q=d;S.searched=true;go('search');break;
    case 'mode':S.mode=arg;S.q='';S.searched=false;render();break;
    case 'search':doSearch();break;
    case 'quick':S.mode='id';S.q=arg;S.searched=true;go('search');break;
    case 'unavailable':toast('Only PAT1024 has a full demo record in this prototype.');break;
    case 'open-record':S.patient='PAT1024';S.accessErr=false;go('access');break;
    case 'request-access':
      if(!S.confirm){S.accessErr=true;render();break;}
      S.access=true;S.accessErr=false;
      if(!S.logged){S.log.unshift(NEW_ENTRY);S.logged=true;}
      render();break;
    case 'modal':openModal(arg);break;
    case 'close-modal':closeModal();break;
    case 'tl':S.tlSel=arg;render();break;
    case 'filter':S.filter=arg;render();break;
    case 'focus-rec':S.filter='all';S.focus=arg;go('records');break;
    case 'admin-filter':S.adminFilter=arg;render();break;
  }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='confirm'){S.confirm=e.target.checked;if(S.confirm&&S.accessErr){S.accessErr=false;render();}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id){
    if((e.target.id==='uid'||e.target.id==='pwd')&&S.route.indexOf('login-')===0){login(S.route.replace('login-',''));}
    else if(e.target.id==='q'){doSearch();}
    else if(e.target.id==='dq'){var b=document.querySelector('[data-act="dash-search"]');if(b)b.click();}
  }
